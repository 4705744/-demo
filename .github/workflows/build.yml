name: build

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore IndustrialMonitorDemo.sln

      - name: Build
        run: dotnet build IndustrialMonitorDemo.sln -c Release --no-restore
